      sources: [TD, S02]
      used_by: instances.debris
    materials:
      value: {steel_rough: 0.5, concrete: 0.4, generic: 0.1}
      tag: FROZEN
      sources: [S02]
      used_by: instances.debris
    burial: {value: {default: [0.25, 0.50]}, tag: FROZEN, sources: [S02], used_by: instances.burial}

burial:
  scale: {value: {low: 0.5, nominal: 1.0, high: 1.5}, tag: FROZEN, sources: [TD], used_by: instances.burial}
