    kind_use:
      value: {quay: fender_line, pontoon: marina_pontoon, breakwater: breakwater_toe, berth: fishing_berth,
              pier: angling_pier, slipway: slipway, outlet: outfall, mooring: mooring_block, pile: none,
              area: mooring_field, lane: traffic_lane, point: dumping_spot}
      tag: DESIGN
      used_by: sources.default_use
    reference: {value: {}, tag: DESIGN, used_by: sources.centred_affinity}
    typical_levels: {value: [1, 10], tag: DESIGN, used_by: card.note}

# the ten candidate harbours (real bathymetry, companion section 5): the profile a world built there takes
# by default, and the gaps its world card must state
harbours:
  value:
    provincetown: {profile: trap_harbour}
    boothbay: {profile: trap_harbour}
    port_angeles: {profile: trap_harbour, gaps: [wood]}
    port_gardner: {profile: trap_harbour, gaps: [wood]}
    charleston: {profile: trap_harbour}
    boston: {profile: working_port}
    plymouth: {profile: city_harbour}
    venice: {profile: city_harbour}
    marseille: {profile: city_harbour}
    cherbourg: {profile: fishing_harbour}
  tag: DESIGN
  sources: [HD]
  used_by: params.harbour_profile

# ------------------------------------------------------------------------------------------------ groups
groups:
  tyre_line:
    # tyres hung as fenders along one berth and lost together: a line along the wall
    value: {members: [2, 6], spacing_m: [0.5, 2.0], lateral_m: 0.3, along: feature}
    tag: DESIGN
    bracket: "2 to 6 tyres, 0.5 to 2 m apart"
    sources: [R22, R24, R18, R43]
    used_by: groups.tyre_line
    note: "Pomos: 7 to 9 tyres per berth (R22 with the berth count); in Japan most seabed tyres were boats' own
      fenders (R43); Plymouth: groups of 2 to 15 tyres at 5 m linking (R18 positions)"
  pile:
    value: {members: [5, 30], radius_m: [2.0, 6.0]}
    tag: DESIGN
    bracket: "5 to 30 items within 2 to 6 m, overlapping allowed"
    sources: [R18]
    used_by: groups.pile
  gear_ball:
    value: {members: [2, 6], radius_m: [0.6, 1.5], net_chance: 0.7}
    tag: DESIGN
    bracket: "2 to 10 traps with rope"
    sources: [R15]
    used_by: groups.gear_ball
  trap_pair:
    value: {members: [2, 3], spacing_m: [9.0, 27.0], along: random}
    tag: REF
    bracket: "groundline 5 to 20 fathoms = 9 to 37 m inshore; most often 10 to 15 fathoms = 18 to 27 m"
    sources: [R39, R16, R17]
    used_by: groups.trap_pair
    note: "Maine inshore: singles, pairs and triples with one endline (zones A to G of R39)"

# ------------------------------------------------------------------------------------------------ classes
# The class cards: what an instance of each class looks like. They restate the frozen simulator's own cards
# (worldgen/population.py `_instance`, `BURIAL_MAX`), which implement the targets document section 4; a test
# compares them with the simulator. Sizes in metres; `burial` is the upper end of U(0, .) on sand and on mud.
classes:
  plastic_box:
    family: {value: T1, tag: FROZEN, used_by: instances.card}
    size:
      value: {length: [0.50, 0.75], width_ratio: [0.55, 0.70], height: [0.22, 0.35], wall_mm: [2.0, 4.0]}
      tag: FROZEN
      sources: [TD, S02]
      used_by: instances.plastic_box
    states: {value: {flooded: 0.7, part_filled: 0.3}, tag: FROZEN, sources: [TD], used_by: instances.plastic_box}
    fill: {value: [0.05, 0.30], tag: FROZEN, sources: [TD], used_by: instances.plastic_box}
    poses:
      value: {upright: 0.5, inverted: 0.3, on_long_side: 0.14, on_end: 0.06}
      tag: FROZEN
      sources: [TD, S02]
      used_by: instances.plastic_box
    burial: {value: {default: [0.15, 0.40]}, tag: FROZEN, sources: [TD], used_by: instances.burial}
    material: {value: pp_shell, tag: FROZEN, used_by: instances.card}
  drum_200l:
    family: {value: T2, tag: FROZEN, used_by: instances.card}
    size:
      value: {diameter: 0.585, height: 0.890, wall_mm: [0.9, 1.6]}
      tag: FROZEN
      sources: [TD, S02]
      used_by: instances.drum_200l
    poses: {value: {lying: 0.6, standing: 0.4}, tag: FROZEN, sources: [TD], used_by: instances.drum_200l}
    states:
      value: {standing_sediment_inside: 0.3}
      tag: FROZEN
      sources: [S02]
      used_by: instances.drum_200l
    fill: {value: [0.1, 0.5], tag: FROZEN, sources: [S02], used_by: instances.drum_200l}
    burial:
      value: {lying: [0.20, 0.50], standing: [0.10, 0.30]}
      tag: FROZEN
      sources: [TD]
      used_by: instances.burial
    material: {value: steel_shell, tag: FROZEN, used_by: instances.card}
  concrete_block:
    family: {value: T3, tag: FROZEN, used_by: instances.card}
    size:
      value: {a: [0.5, 1.0], b: [0.4, 0.8], c: [0.2, 0.6], bevel_mm: [0.0, 30.0]}
      tag: FROZEN
      sources: [TD, S02]
      used_by: instances.concrete_block
    poses: {value: {largest_face_down: 0.8}, tag: FROZEN, sources: [TD], used_by: instances.concrete_block}
    burial: {value: {default: [0.10, 0.30]}, tag: FROZEN, sources: [TD], used_by: instances.burial}
    material: {value: concrete, tag: FROZEN, used_by: instances.card}
  trap_pot:
    family: {value: T4, tag: FROZEN, used_by: instances.card}
    variants:
      value: {us_wire: 0.5, jp_frame: 0.5}
      tag: FROZEN
      sources: [S02]
      used_by: instances.trap_pot
    size:
      value: {us_wire: {side: 0.61, height: [0.51, 0.61], wire_mm: [1.2, 1.6]},
              jp_frame: {length: [0.95, 1.00], width: [0.40, 0.68], height: [0.40, 0.45]}}
      tag: FROZEN
      sources: [TD, S02]
      used_by: instances.trap_pot
    poses: {value: {upright: 0.8, on_side: 0.2}, tag: FROZEN, sources: [TD, R3, R4, R5], used_by: instances.trap_pot}
    burial: {value: {default: [0.20, 0.40]}, tag: FROZEN, sources: [TD], used_by: instances.burial}
    material: {value: steel_rough, tag: FROZEN, used_by: instances.card}
    fill_fraction: {value: 0.07, tag: FROZEN, sources: [S02], used_by: instances.trap_pot}
  pipe_steel:
    family: {value: T5, tag: FROZEN, used_by: instances.card}
    size:
      value: {length: [1.0, 3.0], diameter: [0.10, 0.30], wall_mm: [3.0, 8.0]}
      tag: FROZEN
      sources: [TD, S02]
      used_by: instances.pipe_steel
    burial: {value: {default: [0.30, 0.60]}, tag: FROZEN, sources: [TD], used_by: instances.burial}
    material: {value: steel_shell, tag: FROZEN, used_by: instances.card}
  tire_car:
    family: {value: T6, tag: FROZEN, used_by: instances.card}
