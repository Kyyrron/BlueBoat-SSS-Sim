# ------------------------------------------------------------------------------------------------ profiles
# A profile: the class weights of a harbour of that type, the share of targets among the sonar-size items,
# the default use of each kind of feature, and the reference composition of sources for which the class
# weights hold exactly (a harbour with other sources departs from them; the report shows by how much).
profiles:
  fishing_harbour:
    label: {value: "Fishing harbour (small shelter, Mediterranean or Japanese type)", tag: DESIGN, used_by: card.legend}
    weights:
      value: {plastic_box: 0.10, drum_200l: 0.02, concrete_block: 0.05, trap_pot: 0.10, pipe_steel: 0.03,
              tire_car: 0.50, net_bundle: 0.20}
      tag: DESIGN
      bracket: "tyres 0.3 to 0.7"
      sources: [R22, R23, R25]
      used_by: sources.profile_mix
    target_share: {value: 0.6, tag: DESIGN, bracket: "0.4 to 0.8", sources: [R22], used_by: sources.target_share}
    kind_use:
      value: {quay: fender_line, pontoon: fishing_berth, breakwater: breakwater_toe, berth: fishing_berth,
              pier: angling_pier, slipway: slipway, outlet: outfall, mooring: mooring_block, pile: none,
              area: mooring_field, lane: traffic_lane, point: dumping_spot}
      tag: DESIGN
      used_by: sources.default_use
    reference:
      value: {fender_line: 0.5, fishing_berth: 0.3, breakwater_toe: 0.1, slipway: 0.1}
      tag: DESIGN
      used_by: sources.centred_affinity
    typical_levels: {value: [5, 8], tag: DESIGN, sources: [R22, R23], used_by: card.note}
  trap_harbour:
    label: {value: "Trap harbour (lobster or crab)", tag: DESIGN, used_by: card.legend}
    weights:
      value: {plastic_box: 0.05, drum_200l: 0.01, concrete_block: 0.04, trap_pot: 0.65, pipe_steel: 0.03,
              tire_car: 0.07, net_bundle: 0.15}
      tag: DESIGN
      bracket: "traps 0.5 to 0.8"
      sources: [R3, R4, R5, R15]
      used_by: sources.profile_mix
    target_share: {value: 0.7, tag: DESIGN, bracket: "0.5 to 0.9", sources: [R3], used_by: sources.target_share}
    kind_use:
      value: {quay: fishing_berth, pontoon: fishing_berth, breakwater: breakwater_toe, berth: fishing_berth,
              pier: angling_pier, slipway: slipway, outlet: outfall, mooring: mooring_block, pile: none,
              area: fishing_ground, lane: traffic_lane, point: dumping_spot}
      tag: DESIGN
      used_by: sources.default_use
    reference:
      value: {fishing_ground: 0.4, traffic_lane: 0.2, fishing_berth: 0.25, mooring_block: 0.15}
      tag: DESIGN
      used_by: sources.centred_affinity
    typical_levels: {value: [3, 6], tag: DESIGN, sources: [R3, R4], used_by: card.note}
  city_harbour:
    label: {value: "City harbour (city-centre quays, canals)", tag: DESIGN, used_by: card.legend}
    weights:
      value: {plastic_box: 0.15, drum_200l: 0.02, concrete_block: 0.05, trap_pot: 0.35, pipe_steel: 0.05,
              tire_car: 0.25, net_bundle: 0.13}
      tag: DESIGN
      bracket: "lattice items (as trap_pot stand-ins) 0.2 to 0.6"
      sources: [R19, R20]
      used_by: sources.profile_mix
    target_share: {value: 0.6, tag: DESIGN, bracket: "0.4 to 0.8", sources: [R20], used_by: sources.target_share}
    kind_use:
      value: {quay: urban_quay, pontoon: marina_pontoon, breakwater: breakwater_toe, berth: urban_quay,
              pier: urban_quay, slipway: slipway, outlet: outfall, mooring: mooring_block, pile: none,
              area: mooring_field, lane: none, point: dumping_spot}
      tag: DESIGN
      used_by: sources.default_use
    reference:
      value: {urban_quay: 0.7, marina_pontoon: 0.3}
      tag: DESIGN
      used_by: sources.centred_affinity
    typical_levels: {value: [4, 8], tag: DESIGN, sources: [R2, R20], used_by: card.note}
  marina:
    label: {value: "Marina (sport boats)", tag: DESIGN, used_by: card.legend}
    weights:
      value: {plastic_box: 0.15, drum_200l: 0.01, concrete_block: 0.10, trap_pot: 0.05, pipe_steel: 0.04,
              tire_car: 0.35, net_bundle: 0.30}
      tag: DESIGN
      bracket: "ropes and nets 0.2 to 0.45"
      sources: [R12, R21]
      used_by: sources.profile_mix
    target_share: {value: 0.5, tag: DESIGN, bracket: "0.3 to 0.7", sources: [R12], used_by: sources.target_share}
    kind_use:
      value: {quay: marina_pontoon, pontoon: marina_pontoon, breakwater: breakwater_toe, berth: marina_pontoon,
              pier: angling_pier, slipway: slipway, outlet: outfall, mooring: mooring_block, pile: none,
              area: mooring_field, lane: none, point: dumping_spot}
      tag: DESIGN
      used_by: sources.default_use
    reference:
      value: {marina_pontoon: 0.7, mooring_block: 0.2, slipway: 0.1}
      tag: DESIGN
      used_by: sources.centred_affinity
    typical_levels: {value: [2, 5], tag: DESIGN, sources: [R12], used_by: card.note}
  working_port:
    label: {value: "Working port (commercial quays, shipyard)", tag: DESIGN, used_by: card.legend}
    weights:
      value: {plastic_box: 0.05, drum_200l: 0.05, concrete_block: 0.15, trap_pot: 0.05, pipe_steel: 0.25,
              tire_car: 0.30, net_bundle: 0.15}
      tag: DESIGN
      bracket: "metal pieces and tyres dominant"
      sources: [R1, R8, R10]
      used_by: sources.profile_mix
    target_share: {value: 0.4, tag: DESIGN, bracket: "0.2 to 0.6", sources: [R1, R8], used_by: sources.target_share}
    kind_use:
      value: {quay: working_quay, pontoon: working_quay, breakwater: breakwater_toe, berth: working_quay,
              pier: working_quay, slipway: slipway, outlet: outfall, mooring: mooring_block, pile: none,
              area: mooring_field, lane: none, point: dumping_spot}
      tag: DESIGN
      used_by: sources.default_use
    reference:
      value: {working_quay: 0.7, breakwater_toe: 0.2, mooring_block: 0.1}
      tag: DESIGN
      used_by: sources.centred_affinity
    typical_levels: {value: [5, 8], tag: DESIGN, sources: [R1], used_by: card.note}
  generic:
    label: {value: "Generic (the targets document's single-kernel model)", tag: DESIGN, used_by: card.legend}
    weights:
      value: {plastic_box: 0.15, drum_200l: 0.05, concrete_block: 0.10, trap_pot: 0.15, pipe_steel: 0.10,
              tire_car: 0.30, net_bundle: 0.15}
      tag: DESIGN
      sources: [TD]
      used_by: sources.profile_mix
    target_share: {value: 0.5, tag: DESIGN, bracket: "0.3 to 0.7", sources: [TD], used_by: sources.target_share}
    kind_use:
      value: {quay: generic_quay, pontoon: generic_pontoon, breakwater: generic_breakwater, berth: generic_berth,
              pier: generic_quay, slipway: generic_quay, outlet: generic_outlet, mooring: generic_mooring,
              pile: none, area: generic_mooring, lane: none, point: generic_quay}
      tag: DESIGN
      used_by: sources.default_use
    reference:
      value: {generic_quay: 0.45, generic_breakwater: 0.15, generic_berth: 0.15, generic_pontoon: 0.1,
