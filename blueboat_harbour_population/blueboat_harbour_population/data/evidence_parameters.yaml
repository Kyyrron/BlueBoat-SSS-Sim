      used_by: sources.tag_mix
    debris: {value: 0.7, tag: DESIGN, bracket: "0.3 to 1.5", sources: [R21], used_by: sources.target_share}
    kernel:
      value: {near: exponential, scale_m: 7.0, broad_share: 0.2}
      tag: DESIGN
      bracket: "scale 5 to 10 m"
      sources: [R12, R21]
      used_by: sources.kernel_profile
    patch:
      value: {share: 0.6, spots_per_100m: 1.5, sigma_m: 6.0}
