      tag: FROZEN
      sources: [TD, S02]
      used_by: instances.tire_car
    poses: {value: {flat: 0.85, on_tread: 0.15}, tag: FROZEN, sources: [TD], used_by: instances.tire_car}
    burial: {value: {default: [0.30, 0.60]}, tag: FROZEN, sources: [TD], used_by: instances.burial}
    material: {value: rubber, tag: FROZEN, used_by: instances.card}
  net_bundle:
    family: {value: T7, tag: FROZEN, used_by: instances.card}
    variants: {value: {tangle: 0.7, rope_coil: 0.3}, tag: FROZEN, sources: [S02], used_by: instances.net_bundle}
    size:
      value: {tangle: {length: [0.5, 2.0], width: [0.4, 1.5], height: [0.1, 0.5], strand_mm: [10.0, 20.0]},
              rope_coil: {across: [0.3, 0.8], rope_mm: [12.0, 16.0], layers: [2, 8]}}
