      sources: [TD, S02]
      used_by: instances.net_bundle
    volume_fraction: {value: {low: 0.05, nominal: 0.12, high: 0.30}, tag: FROZEN, sources: [S02], used_by: instances.net_bundle}
    burial: {value: {default: [0.50, 0.70]}, tag: FROZEN, sources: [TD], used_by: instances.burial}
