# Parameters of the harbour population model: every number, with its tag, bracket and sources.
#
# A PARAMETER is a mapping with the keys `value` and `tag` (and `bracket`, `sources`, `used_by`, `note`).
# Tags: REF     read in a source (the source key says which; how it was read is in docs/population/EVIDENCE.md)
#       DERIVED computed from referenced values (the computation is in `note` or in EVIDENCE.md)
#       DESIGN  a modelling choice: a default with a bracket and a reason, never a measurement
#       CHECK   not verified
#       FROZEN  a value of the frozen simulator, copied here (a test compares it with the simulator's)
# `sources` are the keys of docs/population/EVIDENCE.md, section "References" (R1-R27: the companion's numbering,
# re-read on 2026-11-21; R28 on: found by this session; TD the targets document; HD the harbours document through
# the companion; FRZ the frozen simulator; S02 the simulator's session-02 code; MODEL this model's own statistics).
# `used_by` names the function that reads the parameter (module.function of this package).
#
# Class order everywhere: plastic_box (T1), drum_200l (T2), concrete_block (T3), trap_pot (T4),
# pipe_steel (T5), tire_car (T6), net_bundle (T7); debris is C1.
format: blueboat_population_parameters/1

# ------------------------------------------------------------------------------------------------ density
levels:
  density_per_ha:
    # mean density of sonar-size litter (targets + debris; no structures, no small litter) in the active
    # band, for the density level 1..10: 10^((s-1)/4) up to 5, 10 * 10^((s-5)/5) from 5
    value: {1: 1.0, 2: 1.78, 3: 3.16, 4: 5.62, 5: 10.0, 6: 15.8, 7: 25.1, 8: 39.8, 9: 63.1, 10: 100.0}
    tag: DESIGN
    bracket: "level 5: 5.9 to 13.9 per ha (geometric means of the documented basins); level 10: 30 to 500 per ha"
    sources: [R1, R2, R3, R4, R20, R22, R18, R32, R33, TD]
    used_by: sources.level_density
    note: "anchors in EVIDENCE.md section 2: level 1 ~ Port Gardner after removals and the never-cleaned UK harbour
      surveys (0.2-2 per ha); level 5 = the targets document's nominal 10 per ha (Venice Grand Canal 11.6);
      Thessaloniki 25 (sonar-size) to 29 per ha between levels 7 and 8; Plymouth Sound tyres 17.6 per ha over its
      densest 9 ha; Pomos fender shelter ~500 tyres per ha over a 0.36 ha basin (a quay-bound extreme: level 10
      with a fender line's activity raised)"
  group_chance:
    # chance that an emission event is a group (where the source has a group process)
    value: {1: 0.05, 2: 0.08, 3: 0.10, 4: 0.13, 5: 0.16, 6: 0.19, 7: 0.22, 8: 0.24, 9: 0.27, 10: 0.30}
    tag: DESIGN
    bracket: "0 to 0.5"
    sources: [R18, R3, R15]
    used_by: sources.group_chance
    note: "neglected harbours have piles and tyre lines, cleaned ones do not. Checks: 35 % of the 936 mapped tyres of
      Plymouth Sound have a neighbour within 5 m (groups up to 15); 37 % of the Port Angeles West pots one within
      10 m (R3 Appendix 2)"
  small_litter_per_m2:
    # hard small litter of 0.1 to 0.4 m (the frozen `small_litter` seabed layer), world mean
    value: {1: 0.010, 2: 0.016, 3: 0.024, 4: 0.038, 5: 0.060, 6: 0.092, 7: 0.14, 8: 0.21, 9: 0.33, 10: 0.50}
    tag: DESIGN
    bracket: "0.01 to 0.5 (the frozen R2 clutter presets low and high)"
    sources: [R12, R11, FRZ]
    used_by: sources.small_litter_density
    note: "levels 1, 5, 10 = the frozen presets low, nominal, high (campaign.CLUTTER); geometric between. Ratio to
      the sonar-size density: 60 at level 5; 16 to 28 measured in the Krk anchorage (R11)"
  retention:
    # share of the planned objects that the 3 m spacing rule leaves, measured on the reference basins
    # (Part 4 statistics); the model divides its intensities by it
    value: {1: 0.98, 2: 0.98, 3: 0.98, 4: 0.98, 5: 0.98, 6: 0.955, 7: 0.93, 8: 0.905, 9: 0.88, 10: 0.855}
    tag: DERIVED
    bracket: "0.6 to 1.0"
    sources: [MODEL]
    used_by: sources.retention
    note: "realised over asked density in the active band, mean of the six named profiles over 200 seeds x 12
      campaign basins (worldgen_v11/stats, passes 1 and 2): 0.98 up to level 5, 0.855 at level 10, linear between;
      the profiles spread about it by up to +-0.09 at level 10 (groups need more room)"

active_band_m:
  value: 50.0
  tag: DESIGN
  bracket: "30 to 100"
  sources: [TD]
  used_by: sources.active_band
  note: "water within this distance of a source feature is the band that the level's density refers to"

far_field_share:
  value: 0.02
  tag: DESIGN
  bracket: "0.005 to 0.10"
  sources: [R2]
  used_by: sources.far_field
  note: "density outside the active band over the level's density; Venice lagoon-wide over Grand Canal = 0.0065"

point_reach_m:
  value: 15.0
  tag: DESIGN
  bracket: "10 to 30"
  sources: [R10, R40]
  used_by: sources.reach_m
  note: "a point feature (a mooring block, an outlet) owns the water within this distance"

dominating_per_ha:
  value: 600.0
  tag: DESIGN
  bracket: "fixed"
  sources: [MODEL]
  used_by: sampling.candidates
  note: "candidates are drawn at this density over a source's reach and thinned; a level or a share is a subset"

# ------------------------------------------------------------------------------------------------ envelope
envelope:
  altitude_m:
    value: [4.5, 7.0]
    tag: FROZEN
    sources: [FRZ]
    used_by: model.allowed_mask
    note: "SIM_VALIDITY_CONDITIONS.md section 2"
  heave_margin_m:
    value: 0.10
    tag: FROZEN
    sources: [FRZ]
    used_by: model.allowed_mask
    note: "worldgen/domain.py HEAVE_MARGIN_M"
  border_m:
    value: 2.0
    tag: FROZEN
    sources: [FRZ]
    used_by: model.allowed_mask
    note: "no object within 2 m of the world's limits (campaign.plan_world)"

spacing:
  target_m:
    value: 3.0
    tag: DESIGN
    bracket: "2 to 5"
    sources: [TD]
    used_by: sampling.hard_core
    note: "between singles and between groups, so that two echoes do not merge"
  other_m:
    value: 1.0
    tag: FROZEN
    sources: [FRZ]
    used_by: sampling.hard_core
    note: "debris to anything (population.populate)"
  clearance_m:
    value: 0.3
    tag: FROZEN
    sources: [FRZ]
    used_by: sampling.hard_core
    note: "gap between two footprints, and between a footprint and a wall or a structure"

# ------------------------------------------------------------------------------------------------ sources
# A source tag: what a feature is used for. `emits`: relative emission of each class (0 = never);
# `debris`: relative emission of debris; `kernel`: where its objects lie, as a density per unit area against
# the distance to the feature: a `near` part (shape and scale) holding 1 - broad_share of the objects and a
# flat part over the active band holding broad_share; `groups`: the group processes it has, each with the
# class it groups and its weight in the group chance.
tags:
  fender_line:
    label: {value: "Fender line (boats berthed against tyre fenders)", tag: DESIGN, used_by: card.legend}
    emits:
      value: {plastic_box: 0.3, drum_200l: 0.05, concrete_block: 0.1, trap_pot: 0.1, pipe_steel: 0.05,
              tire_car: 1.0, net_bundle: 0.3}
      tag: DESIGN
      bracket: "tyres dominant"
      sources: [R22, R23, R24]
      used_by: sources.tag_mix
    debris: {value: 0.5, tag: DESIGN, bracket: "0.2 to 1", sources: [R22], used_by: sources.target_share}
    kernel:
      value: {near: half_normal, scale_m: 3.0, broad_share: 0.2}
      tag: DESIGN
      bracket: "scale 2 to 4 m; broad share 0.1 to 0.4"
      sources: [R22, R24]
      used_by: sources.kernel_profile
    patch:
      value: {share: 0.6, spots_per_100m: 1.5, sigma_m: 6.0}
      tag: DESIGN
      bracket: "share 0.3 to 0.8; 1 to 3 spots per 100 m; sigma 3 to 12 m"
      sources: [R18, R3, R32]
      used_by: sources.patch_field
      note: "litter is lost at particular berths: all six man-made sonar targets of St Mary's Harbour lie in one
      47 x 43 m patch at the quay head (R32); the share and the spot spacing are checked against the measured
      patterns (EVIDENCE.md section 4)"
    groups:
      value: {tyre_line: {class: tire_car, weight: 1.0}}
      tag: DESIGN
      sources: [R22, R24]
      used_by: groups.processes
  urban_quay:
    label: {value: "City quay, promenade or bridge", tag: DESIGN, used_by: card.legend}
    emits:
      value: {plastic_box: 0.5, drum_200l: 0.1, concrete_block: 0.2, trap_pot: 1.0, pipe_steel: 0.2,
              tire_car: 0.6, net_bundle: 0.2}
      tag: DESIGN
      bracket: "lattice items (bicycles, scooters, trolleys) dominant: 90 % of the large items in Copenhagen"
      sources: [R19, R20]
      used_by: sources.tag_mix
    debris: {value: 1.0, tag: DESIGN, bracket: "0.5 to 2", sources: [R21], used_by: sources.target_share}
    kernel:
      value: {near: bump, mode_m: 3.0, scale_m: 3.0, broad_share: 0.2}
      tag: DESIGN
      bracket: "0 to 10 m from the wall, mode at 2 to 4 m"
      sources: [R19, R20]
      used_by: sources.kernel_profile
    patch:
      value: {share: 0.6, spots_per_100m: 1.5, sigma_m: 6.0}
      tag: DESIGN
      bracket: "share 0.3 to 0.8; 1 to 3 spots per 100 m; sigma 3 to 12 m"
      sources: [R18, R3, R32]
      used_by: sources.patch_field
      note: "litter is lost at particular berths: all six man-made sonar targets of St Mary's Harbour lie in one
      47 x 43 m patch at the quay head (R32); the share and the spot spacing are checked against the measured
      patterns (EVIDENCE.md section 4)"
    groups: {value: {}, tag: DESIGN, used_by: groups.processes}
    stand_in:
      # trap_pot instances of this source stand for lattice objects the object set lacks
      value: {trap_pot: {share: 1.0, of: {bicycle: 0.63, e_scooter: 0.37}}}
      tag: DERIVED
      bracket: "share 0.8 to 1"
      sources: [R19]
      used_by: instances.stand_in
      note: "Copenhagen 2020: 299 bicycles and 178 e-scooters among the lattice items = 0.63 / 0.37"
  working_quay:
    label: {value: "Working quay, shipyard or crane berth", tag: DESIGN, used_by: card.legend}
    emits:
      value: {plastic_box: 0.2, drum_200l: 0.5, concrete_block: 0.8, trap_pot: 0.1, pipe_steel: 1.0,
              tire_car: 0.6, net_bundle: 0.3}
      tag: DESIGN
      bracket: "metal pieces, wires, tyres, blocks"
      sources: [R1, R8, R10]
      used_by: sources.tag_mix
    debris: {value: 1.5, tag: DESIGN, bracket: "1 to 3", sources: [R8, R21], used_by: sources.target_share}
    kernel:
