      tag: DESIGN
      used_by: sources.centred_affinity
    typical_levels: {value: [1, 10], tag: DESIGN, used_by: card.note}
  auto:
    # every feature keeps its own tag (set in the spec or on Screen 5); a feature without one takes the
    # mapping below; the class mix is each source's own (no profile weights)
    label: {value: "Auto, from the features", tag: DESIGN, used_by: card.legend}
    weights:
      value: {plastic_box: 1.0, drum_200l: 1.0, concrete_block: 1.0, trap_pot: 1.0, pipe_steel: 1.0,
              tire_car: 1.0, net_bundle: 1.0}
