nominal_target_min_m: {value: 0.5, tag: FROZEN, sources: [TD], used_by: instances.nominal_target}

# reflectivity of each material name written into an instance (the frozen material library's value; the
# ray-cast sensor does not read it, the legacy renderer does)
material_reflectivity:
  value: {}
  tag: FROZEN
  sources: [FRZ]
  used_by: instances.entry
  note: "filled by the simulator adapter from worldgen.materials.MaterialLibrary; 0.5 without it"

# ------------------------------------------------------------------------------------------------ structures
structures:
  mooring_block:
    value: {size_m: [2.0, 4.0], height_m: [1.0, 2.8], clearance_under_keel_m: 3.0, spacing_m: [20.0, 30.0],
            riser_m: [0.5, 2.0], bar_mm: [14.0, 26.0], path_keep_out_m: 6.0}
    tag: DESIGN
    bracket: "block sizes as surveyed in the project's harbour; spacing 15 to 45 m"
    sources: [TD, FRZ, R27, R40, R41]
    note: "swing radius about 1.7 D + L (R40): 16.5 to 23.6 m for 5 to 8 m of water and 8 to 12 m boats; dense
      fields let neighbouring circles overlap, so blocks lie about 1 to 1.5 radii apart"
    used_by: structures.mooring_field
  pontoon_pile:
    value: {diameter_m: [0.3, 0.5], spacing_m: 12.0, above_water_m: 0.8,
            materials: [concrete, steel_rough, wood_rough]}
    tag: DESIGN
    sources: [FRZ]
    used_by: structures.pontoon_piles
  per_profile:
    # mooring blocks added per hectare of open water when the environment has none (structures: auto)
    value: {fishing_harbour: 0.0, trap_harbour: 1.5, city_harbour: 0.0, marina: 2.0, working_port: 0.5,
            generic: 0.0, auto: 0.0}
    tag: DESIGN
    bracket: "0 to 4 per ha"
    used_by: structures.mooring_field

# ------------------------------------------------------------------------------------------------ small litter
small_litter:
  band:
    value: {width_m: 10.0, factor: 4.0, cap_per_m2: 0.5, floor_share: 0.25}
    tag: DESIGN
    bracket: "factor 2 to 10"
    sources: [R28, R12, R20]
    used_by: layers.small_litter
    note: "small debris 10 times denser under Sydney piers than 50 m away (R28); the German marina samples all lie
      within about 3 m of a quay (R12); never over the frozen R2 high preset"
  items:
    value: {length_min_m: 0.10, length_max_m: 0.40, height_min_m: 0.06, height_max_m: 0.12}
    tag: FROZEN
    sources: [FRZ]
    used_by: layers.small_litter

# ------------------------------------------------------------------------------------------------ redistribution
redistribution:
  value: {light_classes: [plastic_box, net_bundle], share: 0.3, distance_m: [2.0, 8.0]}
  tag: DESIGN
  bracket: "0 to 30 % of the light items, a few metres towards deeper water"
  sources: [R15]
  used_by: model.redistribute

# ------------------------------------------------------------------------------------------------ realism guard
guard:
  factor: {value: 10.0, tag: DESIGN, bracket: "3 to 30", used_by: model.realism_guard,
           note: "hotspots inside a harbour are 10 to 100 times its mean (Port Angeles West against East)"}
  documented_per_ha:
    # highest documented density of the class averaged over a surveyed area
    value: {trap_pot: 4.0, tire_car: 500.0, all: 29.2}
    tag: DERIVED
    sources: [R31, R22, R1]
    used_by: model.realism_guard
    note: "traps: 3.4 probable (4.0 recovered) per ha in the densest Mullica polygons (R31); tyres: 180 in the
      0.36 ha Pomos basin measured on OpenStreetMap; all classes: 56 in 1.92 ha at Thessaloniki (R1)"
