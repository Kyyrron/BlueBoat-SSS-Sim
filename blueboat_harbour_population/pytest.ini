[pytest]
# Run from BlueBoat-SSS-Sim/blueboat_harbour_population/ with the system python:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 /usr/bin/python3 -m pytest
# The tests that drive the frozen simulator need its source root on the path:
#   PYTHONPATH=../blueboat_sss_sim ... (they skip, visibly, without it)
testpaths = test
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
