# Coverage-pass sonar profile -- project_synthesis.md 8.5 reserved setting.
#
# `config/default_sonar.yaml` with `range_length_mm: 30000` (30 m per side) and
# NOTHING else changed, mirroring how `shallow_water_world.yaml` differs from
# `default_world.yaml` by one knob. 8.5 reserves 30 m for coverage passes and
# 15 m for revisit passes; the default profile is the 15 m revisit setting and
# is also the power-calibration anchor (NC #6), so the coverage setting lives
# here rather than moving the default off its anchor.
#
# Bind it from a mission with `sonar_profile: config/coverage_pass_sonar.yaml`;
# the bundle then freezes it and `sss_sim_launch.py` passes it to the node.
#
# Note the wider swath halves cross-track resolution at 600 bins (50 mm bins
# against the default's 25 mm) and slows the free-run ping period to 42 ms;
# 8.5 covers the trade (range setting does not change resolution at a given
# ground range, but it does change ping rate and along-track sampling).
acquisition:
  range_start_mm: 0
  range_length_mm: 30000    # 30 m coverage pass (project_synthesis 8.5)
  msec_per_ping: 0          # 0 = free run (device-native)
  gain_index: 4             # calibration anchor. -1 = device auto-gain, as on
                            # the real node; the simulator has no AGC, so it
                            # resolves to 4 and reports 4 (the profile's
                            # gain_index is uint16 and cannot carry -1).
                            # Ladder covers 0-7 (4-7 measured); else rejected.
  num_results: 600          # 1/600 of range (50 mm bins at 30 m). The device
                            # supports up to 1/1200: set 1200 for
                            # high-res runs (12.5 mm bins); the renderer,
                            # encoder and raw framing scale automatically.
  pulse_len_percent: 0.002

model:
  # Mounting (vehicle frame) -- Omniscan 450 SS beam geometry
  sensor_depth_m: 0.15
  mount_x_m: 0.0
  mount_y_abs_m: 0.20
  beam_tilt_deg: 20.0
  vertical_aperture_deg: 50.0   # spec: 50 deg beam height
  horizontal_aperture_deg: 0.5  # spec: 0.5 deg along-track beam

  # Timing -- the device law, MEASURED on all seven corpus recordings:
  # period = max(50 ms, 2R/c + 3 ms). 20 pings/s up to 30 m (18.4 m and
  # 20 m files sit at exactly 50 ms), range-limited beyond (54 ms at 38 m,
  # 131 ms at 95.6 m, 170 ms at 125.6 m), as the spec sheet states. This
  # is the 20 Hz cap; 0 disables it (experiment knob only).
  max_ping_rate_hz: 20.0

  # Acoustics
  # Range law, fitted against the Shiraishi-jima corpus. Only the product
  # spreading_exponent * (1 - tvg_compensation) is determined; the split is
  # fixed by taking spreading at its physical two-way-intensity value, which
  # makes tvg_compensation 0 -- the profile the device reports is pre-TVG.
  lambert_exponent: 1.0       # not separated from site geometry by the corpus
  absorption_db_per_m: 0.10   # ~450 kHz seawater; not separated from spreading
  spreading_exponent: 4.0     # two-way intensity spreading, r^-4
  tvg_compensation: 0.0
  # Near-nadir first-bottom-return realism (FBR / bottom tracking locks on
  # this -- see docs/sonar_model.md section 3):
  beam_sidelobe_floor: 0.004    # pattern floor (~-24 dB), real sidelobes
  specular_strength: 30.0       # near-normal-incidence lobe amplitude,
                                # sized so the FBR clears a +8 dB detector
                                # threshold even over dark mud/seagrass
  specular_width_deg: 8.0       # angular width of the specular lobe
  specular_looks: 25            # coherent-return fluctuation: Gamma(L,1/L),
                                # CV ~0.2 -- the nadir echo is Rician/high-K,
                                # far steadier than diffuse speckle, which is
                                # what lets bottom tracking lock ping-to-ping
  pulse_smearing: true          # convolve pings with the c*tau/2 range
                                # resolution like the real matched-filter
                                # output; the pulse follows the device law
                                # (1.2-1.5 sample periods, 44 us floor)
  range_filter_bins: 3          # receive-chain envelope floor on that
                                # kernel (corpus lag-1 range correlation
                                # 0.30-0.68; a 3-bin boxcar on the complex
                                # field gives ~0.35)
  # Along-track 0.5 deg beam: ground lines integrated across the azimuth
  # footprint (odd number; 1 = legacy infinitesimal-beam behaviour)
  alongtrack_beam_lines: 5
  # Power encoding. `pwr_results` is normalised per ping onto
  # [min_pwr_db, max_pwr_db] exactly as the device does, so the array carries
  # no absolute level and `calibration_db_offset` is the only level constant.
  # `max_span_db` is the device's own clamp on that dB axis.
  calibration_db_offset: 97.2
  max_span_db: 90.0

  # Shallow-water multipath (enclosed-basin regime): dim ghost seabed
  # displaced +altitude in slant range (bottom-surface-bottom path).
  # First-order model, OFF by default.
  multipath_enabled: false
  multipath_gain: 0.12

  # Noise
  speckle: true
  speckle_looks: 1            # 1 = fully-developed (Rayleigh-amplitude)
                              # speckle; >1 = smoother multi-look Gamma
  # Single-look speckle comes from a ground-fixed scatterer field (a random
  # phasor per ground cell, summed coherently per bin, pulse convolved on the
  # complex field): the bin statistic is Exp(1) as before, but the texture is
  # correlated along range (pulse) and along track (footprint overlap) as the
  # corpus measures (lag-1 0.3-0.7 both ways). false = legacy per-bin draw.
  coherent_scatterers: true
  scatterer_cell_m: 0.01      # seed-class parameter: changing it changes
                              # every image
  scatterer_seed: 0
  # Direct wall echo (closes the former assumption A9): a quay's wet face
  # returns a bright coherent line at its own slant range and occludes the
  # seabed behind it. Strict no-op without walls; strength not
  # corpus-determined (no wall geometry ground truth in the corpus).
  wall_echo_enabled: true
  wall_echo_strength: 30.0
  wall_echo_obliquity_floor: 0.1
  # Wall face + multipath fidelity (2026-09-03, anchored on the
  # fullHarbourCleanExample quay: face +21 dB over the seabed before it,
  # 1.5-4 m beyond ~-12 dB, 6-12 m beyond ~-23 dB -- docs/sonar_model.md
  # section 11). Ghosts carry reflectivity^2 (two bounces) times the
  # Rayleigh roughness law; the single-bounce band folds the seabed in
  # front of a quay into the strip just beyond its face.
  wall_face_diffuse: 0.5
  wall_pontoon_specular: 0.15
  wall_corner_gain: 1.0
  wall_diffuse_fraction: 0.04
  # Fitted as one number with the range law: puts the water column 26 dB below
  # the bottom return, as the corpus does across three range settings.
  # MEASURED separately on the corpus at gain 4 (2026-09-02). The receiver
  # floor is the far decile of the 72-126 m recordings, -6.1 dB reported
  # (mean of dB; -3.6 dB as the linear mean this constant is); the water
  # column is the 1-3 m band, 25.3 dB reported (27.8 dB linear mean). Both
  # are `10**((level - calibration_db_offset)/10)`. The former single fitted
  # value (6.79e-7, 38.5 dB) never reached the real floor and hid the range
  # law beyond ~20 m.
  noise_floor: 8.3e-11
  watercolumn_noise: 1.15e-07   # 40 dB under the FBR peak
  # Radiometric/link degradations are deferred to the downstream
  # augmentation stage per the tuning request -- OFF in the base model
  # (set >0 to re-enable here):
  gain_drift_amp: 0.0
  gain_drift_period_s: 45.0
  dropped_ping_prob: 0.0

  # Sampling: coarse upper bound only -- the renderer automatically
  # refines the ground step to ~half the slant-bin size so every range
  # bin is populated at any num_results.
  sample_step_m: 0.05
