# Simulated dual Cerulean Omniscan 450 SS (port + starboard) -- the profile
# every run uses unless `sonar_config:=` names another.
# `acquisition` mirrors the six run-dependent ROS parameters of the real
# sss_node.py -- identical names and semantics and, since 2026-09-28,
# identical defaults: 20 m, device auto-gain, 1200 bins, pulse 0.00125 (the
# device's best range resolution, and the settings of the beach day's object
# recordings). `model` holds simulation-only physics/noise knobs -- a real
# operator has no equivalent controls. It is calibrated on the field corpus
# (NC #6); the calibration gates of the smoke test pin their own acquisition,
# so a change of acquisition here never moves the calibration.
#
# Every other profile in this directory is this file with ONE idea changed.
# The launches pass all six acquisition values from the resolved profile,
# each overridable per run. See root CLAUDE.md CM-2.
acquisition:
  range_start_mm: 0
  range_length_mm: 20000    # 20 m per side: the 2026-09-07 beach day's setting
                            # and the real sss_node.py default. 16.7 mm bins
  msec_per_ping: 50         # SonarView's command (2026-10-27): 20 pings/s to
                            # ~35 m, range-limited beyond. 0 = free run:
                            # 2R/c + ~2.3 ms, 34.5 Hz at 20 m (measured)
  gain_index: -1            # device auto-gain, the real sss_node.py default.
                            # The simulator has no AGC: -1 resolves to the
                            # calibrated index 4 and reports 4 (the profile's
                            # gain_index is uint16 and cannot carry -1).
                            # 0-7 are accepted (4-7 measured); else rejected.
  num_results: 1200         # the device maximum (1/1200 of range)
  pulse_len_percent: 0.00125  # pulse = max(44.3 us, this x 2R/c), the
                            # measured device law; 0.00125 is SonarView's own
                            # 1.5 / num_results. Up to ~27 m it sits on the
                            # 44.3 us floor, the device's shortest pulse
                            # (33 mm true range resolution)

model:
  # Mounting (vehicle frame) -- Omniscan 450 SS beam geometry
  sensor_depth_m: 0.22   # measured 2026-11-01 (pass 3: hull holes + buoyancy + pool datum)
  mount_x_m: -0.345     # rear-most hull holes vs base_link (was 0.0)
  mount_y_abs_m: 0.285
  beam_tilt_deg: 20.0
  vertical_aperture_deg: 50.0   # spec: 50 deg beam height
  horizontal_aperture_deg: 0.5  # spec: 0.5 deg along-track beam

  # Timing. Every corpus recording (SonarView's) follows period =
  # max(50 ms, 2R/c + 3 ms): 50 ms at 18.4 m and 20 m, 54 ms at 38 m,
  # 131 ms at 95.6 m, 170 ms at 125.6 m. The 50 ms is SonarView's
  # msec_per_ping command, not a device limit -- the device free-runs at
  # 29 ms (34.5 Hz) at 20 m (our driver, 2026-10-27) -- so it now lives in
  # acquisition.msec_per_ping and this experiment-only cap is off (0).
  max_ping_rate_hz: 0.0

  # Acoustics
  # Range law, RE-FITTED 2026-09-18 on two altitudes at once -- the lever the
  # single-altitude fit never had: bath3 (beach, 1.40 m altitude, 12371 pings)
  # and reflectionEvidenceFullharbour (harbour, 7.33 m, 1445 pings). The
  # seabed's absolute dB-vs-slant curve comes back to 0.9 dB rms at BOTH with
  # lambert_exponent 1.0, tvg_compensation 0.30 and calibration_db_offset 81.1;
  # the former (1.0, 0.0, 97.2) matched the harbour and ran ~18 dB hot at the
  # beach. The device does compensate part of the range loss; only the pair
  # (spreading_exponent, tvg_compensation) is determined, so spreading stays at
  # its physical two-way value and the TVG carries the fitted part.
  lambert_exponent: 1.0       # measured over the two altitudes together (2026-09-18)
  absorption_db_per_m: 0.10   # ~450 kHz seawater; not separated from spreading
  spreading_exponent: 4.0     # two-way intensity spreading, r^-4 (incoherent)
  tvg_compensation: 0.30
  # The coherent (specular) component is the field of an IMAGE SOURCE and
  # spreads once over the folded path, not twice like the diffuse field. With
  # r^-2 the reported peak level follows altitude as the corpus measures it
  # (66.6 - 11.3 log10 alt dB over 19 gain-4 files, rms 1.6; simulator
  # 72.1 - 11.5), where sharing r^-4 gave -20 to -27 dB per decade.
  specular_spreading_exponent: 2.0
  # Near-nadir first-bottom-return realism (FBR / bottom tracking locks on
  # this -- see docs/sonar_model.md section 3):
  # Along-track floor on the footprint (an array of length D cannot
  # resolve finer than D). MEASURED 0: the corpus's own along-track
  # texture correlation says the device's footprint follows r*theta to
  # at least 10 m, so it focuses its near field; 0.35 m would put that
  # correlation at 0.76 against the measured 0.36-0.66. Undetermined
  # inside ~3 m -- a point target at 3 and 12 m would settle it.
  array_length_m: 0.0
  beam_sidelobe_floor: 0.004    # pattern floor (~-24 dB), real sidelobes
  specular_strength: 1.75       # near-normal-incidence lobe amplitude.
                                # 2026-10-30 (field calibration pass 2,
                                # promoted through its pre-registered gate):
                                # 12 -> 1.75 = the harbour anchor's FBR crest
                                # (1.36) raised to the smallest value that
                                # keeps the FBR above the +8 dB detector
                                # threshold over seagrass, the darkest seabed,
                                # at 0.6-22 m on every corpus acquisition
                                # (calibration.seabed.fbr_envelope, NC #4)
  specular_width_deg: 8.0       # angular width of the specular lobe
  specular_looks: 25            # coherent-return fluctuation: Gamma(L,1/L),
                                # CV ~0.2 -- the nadir echo is Rician/high-K,
                                # far steadier than diffuse speckle, which is
                                # what lets bottom tracking lock ping-to-ping
  pulse_smearing: true          # convolve pings with the range envelope
                                # the acquisition implies, like the real
                                # matched-filter output; the pulse follows
                                # the device law max(44.3 us, p x 2R/c)
  filter_duration_percent: 0.0015  # receive filter, as the real driver pins
                                # it: envelope = pulse/Ts + this x N + 1 bins
                                # (3 at 600 / 0.002, 5 at 1200 / 0.00125 and
                                # 20 m); texture lag-1 range correlation
                                # 0.30 / 0.50 against the corpus's 0.29 / 0.46
  # Transmit-pulse ringing (MEASURED on diffDepthCompensation.svlog):
  # every real ping leaves the transducer at ~55 dB — brighter than any
  # seabed return — decaying to ~33 dB by 1 m. Lives inside the water
  # column at survey altitudes; joined to the coherent (low-CV) channel.
  # Set ringing_level_db: 0 to disable.
  ringing_level_db: 55.0
  ringing_decay_db_per_m: 22.0
  # Along-track 0.5 deg beam: ground lines integrated across the azimuth
  # footprint (odd number; 1 = legacy infinitesimal-beam behaviour)
  alongtrack_beam_lines: 5
  # Power encoding. `pwr_results` is normalised per ping onto
  # [min_pwr_db, max_pwr_db] exactly as the device does, so the array carries
  # no absolute level and `calibration_db_offset` is the only level constant.
  # `max_span_db` is the device's own clamp on that dB axis.
  calibration_db_offset: 81.1
  max_span_db: 90.0

  # Shallow-water multipath (enclosed-basin regime): dim ghost seabed
  # displaced +altitude in slant range (bottom-surface-bottom path).
  # First-order model, OFF by default.
  multipath_enabled: false
  multipath_gain: 0.12

  # Wall / surface multipath: mirror-source ghosts off the basin boundaries
  # the *world* config declares under `walls:` (the world says which walls
  # exist and how reflective each is; these knobs say whether the path is
  # modelled and how strongly). A ghost lands at its true folded path length
  # and carries its own ground-truth contact. ON by default (2026-09-01):
  # a strict no-op in any world without walls, so no wall-less result moves;
  # walled worlds get their physical reflections without a special profile.
  wall_multipath_enabled: true
  wall_multipath_gain: 1.0      # global scale on every ghost, on top of each
                                # wall's own reflectivity
  surface_mirror_enabled: false # also mirror across z=0. The air/water
                                # interface reflects almost perfectly, but the
                                # path leaves the transducer upward, so the
                                # vertical pattern sees it at -depression:
                                # -8 dB at 20 deg up, -17 dB at 40 deg, and the
                                # sidelobe floor beyond 50.6 deg
  surface_reflectivity: 0.9     # pressure-release interface
  # Direct wall echo (closes the former assumption A9): a quay's wet face
  # returns a bright coherent line at its own slant range and occludes the
  # seabed behind it, as every real harbour log shows. Strict no-op without
  # walls. The strength is not corpus-determined (no wall geometry ground
  # truth exists for the corpus); the obliquity law is cos^2 with a floor.
  wall_echo_enabled: true
  wall_echo_strength: 30.0
  wall_echo_obliquity_floor: 0.1
  # Wall face + multipath fidelity (2026-09-03, anchored on the
  # fullHarbourCleanExample quay: face +21 dB over the seabed before it,
  # 1.5-4 m beyond ~-12 dB, 6-12 m beyond ~-23 dB -- docs/sonar_model.md
  # section 11). Ghosts carry reflectivity^2 (two bounces) times the
  # Rayleigh roughness law; the single-bounce band folds the seabed in
  # front of a quay into the strip just beyond its face.
  wall_face_diffuse: 0.5
  wall_pontoon_specular: 0.15
  wall_corner_gain: 1.0
  wall_diffuse_fraction: 0.04
  ghost_beam_lines: 1           # azimuth lines per ghost render (1 =
                                # infinitesimal beam). The cost lever: ghosts
                                # are dim and already smeared by the bounce

  # Noise
  speckle: true
  speckle_looks: 1            # 1 = fully-developed (Rayleigh-amplitude)
                              # speckle; >1 = smoother multi-look Gamma
  # Single-look speckle comes from a ground-fixed scatterer field (a random
  # phasor per ground cell, summed coherently per bin, pulse convolved on the
  # complex field): the bin statistic is Exp(1) as before, but the texture is
  # correlated along range (pulse) and along track (footprint overlap) as the
  # corpus measures (lag-1 0.3-0.7 both ways). false = legacy per-bin draw.
  coherent_scatterers: true
  scatterer_cell_m: 0.01      # seed-class parameter: changing it changes
                              # every image
  scatterer_seed: 0
  # History: the former single constant, fitted jointly with the range law,
  # put the water column 26 dB below the bottom return (corpus, three range
  # settings). It is now two measured levels, below.
  # MEASURED separately on the corpus at gain 4 (2026-09-02). The receiver
  # floor is the far decile of the 72-126 m recordings, -6.1 dB reported
  # (mean of dB; -3.6 dB as the linear mean this constant is); the water
  # column is the 1-3 m band, 25.3 dB reported (27.8 dB linear mean). Both
  # are `10**((level - calibration_db_offset)/10)`. The former single fitted
  # value (6.79e-7, 35.5 dB at the then offset of 97.2) never reached the real floor and hid the range
  # law beyond ~20 m.
  noise_floor: 3.39e-09
  watercolumn_noise: 4.68e-06   # 25.3 dB reported (27.8 linear); ~28 dB under the
                                # corpus FBR peak at 6-9 m (the margin grows as
                                # the altitude falls)
  # Radiometric/link degradations are deferred to the downstream
  # augmentation stage per the tuning request -- OFF in the base model
  # (set >0 to re-enable here):
  gain_drift_amp: 0.0
  gain_drift_period_s: 45.0
  dropped_ping_prob: 0.0

  # --- shadow, volume scattering and the waterline (2026-09-19) ----------
  # What a shadow's reverberation floor is a fraction OF. "unoccluded" is
  # the culled bin's own would-be response, which collapses to zero where
  # the local incidence clipped at 0 -- a back-facing flank, a cell over
  # land -- and that collapse is the hard black band the 2026-09-19
  # sim-vs-real comparison found between a simulated object and its shadow,
  # where the real image runs continuously. "ambient" is the lit seabed at
  # that range on a flat bottom at this ping's own altitude: smooth, always
  # defined, never collapsing. The floor is the max of the two, so this can
  # only lighten a shadow.
  reverberation_reference: ambient
  # The floor itself: a culled bin sits this many dB under that reference,
  # with the seabed's own speckle. MEASURED on the corpus quay (deep shadow
  # 6-12 m behind the face 17-25 dB under the seabed, 2026-09-18); 0 restores
  # the white receiver floor that made every shadow ~30 dB too deep. Stated
  # here (2026-10-21) rather than left to the dataclass default, so a frozen
  # copy of this profile freezes it too -- the value is unchanged.
  reverberation_db: 18.0
  # Sediment volume backscatter beside the surface term (Bell & Linnett
  # 1997 eq. 12). Shipped at 0 on purpose: the Lambert coefficient this
  # model is calibrated on is an empirical total over the corpus's grazing
  # band, so it already contains whatever volume term that band sees.
  volume_scattering_coeff: 0.0
  # Angular softening of the horizon test (0 = the hard boolean).
  penumbra_deg: 0.0
  # Depth over which a cell fades out as the water above it thins. NC #13 is
  # untouched -- ground at or above the transducer still returns exactly
  # nothing; this softens only the last centimetres of water before the
  # waterline, which is the difference between a shoreline and a per-ping
  # sawtooth.
  shore_taper_m: 0.0

  # --- coherent / incoherent split (2026-09-19) --------------------------
  # C = exp(-(2 k sigma cos theta)^2), the Eckart/Rayleigh law the wall
  # model already uses. What stays coherent leaves in the mirror direction
  # and never comes back, so only (1 - C) scatters diffusely. At 450 kHz
  # this is exactly 0 for every seabed material (2 k sigma is 15 for mud,
  # 38 for sand) and appreciable only for manufactured surfaces -- which is
  # why the 2026-09-07 field box images as a faint patch (+2.5 dB over the
  # sand at 19 deg grazing) and not as the +32 dB glint an unsplit model
  # gives it.
  coherent_split: true
  sonar_frequency_hz: 450000.0
  # Near-normal lobe width on a surface the roughness raster calls smooth
  # (0 = the global specular_width_deg). A flooded storage box is not a
  # mirror -- its walls bow -- so what comes back is its distribution of
  # facet slopes. UNDETERMINED, shipped off: the field box's +5.7 dB at
  # 7 deg against +2.5 dB at 19 deg would solve to ~15 deg only if that pair
  # were one target's angular law, and it carries an unknown yaw and burial
  # (docs/sonar_model.md §6).
  smooth_lobe_width_deg: 0.0

  # --- objects: the facet layer (2026-09-28, NC #17) ----------------------
  # A smooth solid object (a mirror at 3.3 mm wavelength: plastic, metal,
  # glass...) scatters from its exact geometry -- coherent Kirchhoff patches
  # plus the incoherent residual -- instead of the raster's Lambert law,
  # which is sand's and does not hold for it. Glints, their aspect
  # dependence (a box wall within ~1 deg of broadside) and edge returns
  # emerge from the geometry; no object carries a brightness knob.
  # false = the objects still occlude (their shadows stay) but return
  # nothing: a diagnostic.
  object_facets: true
  # Tessellation patch [m]: linear phase across it, beam constant over it.
  facet_patch_m: 0.01
  # Sand's Lambert parameter at 450 kHz, the one constant that puts an
  # object's cross-section on the calibrated seabed's scale. Literature
  # (J&R 2007 Fig. 12.3: -20.2 dB at 20-40 kHz; par. 12.1.2: +6-8 dB/decade
  # -> -12.0 at 450 kHz), never fitted to an object.
  sand_lambert_mu_db: -12.0

  # --- image formation (2026-09-19) --------------------------------------
  # How the ground samples that fall in a range bin become that bin's value.
  # "mean": the azimuth-weighted mean of them -- the pre-2026-09-19
  # behaviour, under which a fold of a hundred samples into one bin (a
  # rising shore, an object's near wall) brightens it not at all, because
  # the fold divides out again. "energy": their integral over the
  # resolution cell, referenced to one bin of flat ground at the same
  # range, so layover accumulates the way the device's does. Flat seabed in
  # the far field is bit-identical between the two; near nadir the residual
  # r/y term adds +1.55 dB at 1.4x altitude and +0.14 dB at 4x.
  image_formation: energy
  # sqrt(1+slope^2), the heightfield's surface-area element. Without it an
  # object's wall contributes one raster cell of ground length whatever the
  # grid spacing is, so its brightness is a function of world.resolution
  # (measured: 7.4 dB of spread across 0.20/0.10/0.05 m); with it the
  # contribution converges on the wall's true height (0.2 dB; smoke [8]
  # gates < 2 dB). Only
  # meaningful under image_formation: energy.
  facet_area_jacobian: true
  # Cap on how many flat-ground bins may fold into one (dB, 0 = uncapped).
  # A vertical cliff folds an unbounded ground length into a single bin;
  # the device's dynamic range does not.
  layover_gain_max_db: 20.0

  # --- field-calibration terms (pass 2, 2026-10-23) --------------------
  # Stated at their OFF values, which reproduce the 2026-10-21 model bit for
  # bit (smoke [17]: render + encode fixtures). The candidate profile
  # config/field_candidate_v1_sonar.yaml switches them on;
  # docs/engineering/calibration_results.md has the evidence.
  # Seabed / coherent level x (tau / pulse_level_reference_s)^k: measured
  # within file +0.93 (diffuse) and +1.07 (FBR crest) dB per dB of pulse.
  pulse_level_exponent: 0.0
  specular_pulse_exponent: 0.0
  pulse_level_reference_s: 6.65e-05
  # The device's reported-level ceiling (measured 67.81 + 0.91*10log10(tau /
  # 66.5 us) over 26 acquisition groups), as a C1 soft knee in the encoder.
  # ON since 2026-10-30 (pass-2 bundle B, promoted with specular_strength
  # 1.75): 67.9 dB = the max_pwr_db pile-up of the beach calibration files.
  receiver_ceiling: true
  receiver_ceiling_db: 67.9
  receiver_ceiling_pulse_exponent: 1.0
  receiver_ceiling_knee_db: 1.0
  # Ground-fixed Gamma intensity texture (K-distributed seabed): 0 = off.
  texture_k_inv_shape: 0.0
  texture_k_cell_m: 0.5
  # Per-ping, per-side log-normal level jitter (unit mean), 0 = off.
  ping_level_jitter_db: 0.0

  # Sampling: coarse upper bound only -- the renderer automatically
  # refines the ground step to ~half the slant-bin size so every range
  # bin is populated at any num_results.
  sample_step_m: 0.05
