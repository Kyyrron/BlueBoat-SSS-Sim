# Field-calibration CANDIDATE v1 (pass 2, 2026-10-30) -- PROVISIONAL, NOT PROMOTED.
#
# Self-contained sonar profile: every acquisition and model field is stated, so
# this file renders with exactly these constants whatever the dataclass defaults
# become. It is default_sonar.yaml with the field-calibration terms switched on:
#   A  seabed level ~ (pulse / 66.5 us)^1 (prior) + refitted offset / TVG / Lambert;
#   B  receiver ceiling 67.9 dB (measured), coherent channel ~ pulse^1 (prior),
#      specular_strength 12 -> 6 (the NC #4 FBR-envelope bound; the field crest
#      alone would take 2.5, which loses the first bottom return at 5-21 m);
#   C  K-distributed seabed texture (texture_k_inv_shape 1.5).
# `provenance.differs_from_default_sonar_yaml` lists every changed value and
# where it came from; docs/engineering/calibration_results.md has the
# per-session comparison against the default and why it is not the default
# (CLAUDE.md NC #6: the shipped calibration moves only through the
# pre-registered gate). Use it explicitly:
#     ros2 launch blueboat_sss_sim sss_sim_launch.py ... sonar_config:=field_candidate_v1_sonar.yaml
# Unlike the other profiles it changes more than one idea: it is a calibration
# artifact composed onto a base profile -- regenerate it, never hand-edit it.
