# Sea-state presets for the simulated BlueBoat -- the single source of truth
# for the sea_state_node, the launch files and the MCS launch dialog (MCS
# reads this file through the installed share directory; it never imports
# the package). Physics and references: docs/sea_state_model.md.
#
# Directions are NOT stored here: a preset is a strength, the direction
# (compass degrees the current / waves come FROM) is chosen per run.
#
# Scale: harbour-realistic (the study site is an enclosed harbour basin --
# fetch-limited chop, tidal / river current) plus one stress level per
# component. Wave presets are placed on the Douglas / WMO 3700 sea-state
# code by Hs (codes corrected 2026-10-08: 0.35 m is code 2, not 3); Tp sits
# above the DNV-RP-C205 §3.5.10 wind-sea band, see the waves: comment.
#
# Plain-language blocks (2026-10-08, additive): `current_variation:` (how
# much the current wanders around its mean -- the MCS "Variation" choice)
# and `wave_options:` (crest length, passing wakes). Labels and
# descriptions are what the operator reads; `reference` is for the docs.
format: blueboat_sea_state_presets/1

# Hulls used by the wave excitation (docs/sea_state_model.md §5):
#  * gazebo_box -- the Gazebo buoyancy box of BlueBoat-Control
#    blueboat_description/urdf/blueboat.xacro (box = (x,y,z)_size ×
#    buoyant_correction, buoyant_correction = 1.01·((mass + 2·prop_mass) /
#    (1000·x·y·z))^(1/3) = 0.34342, centred at link z = +0.05). Mirrored
#    here so its flat-plane term can be cancelled while waves are active.
#    It has 3 % reserve buoyancy (1.01 scales each dimension) -- a URDF artefact the wave model must not
#    inherit. The smoke test recomputes it from that formula.
#  * catamaran -- the hydrostatic hull the wave force integrates. Since
#    2026-11-15 (session 03, R-8) the BlueBoat demihulls of the vendor CAD
#    (BLUEBOAT_HULL_SET_BR-101652, 2024-02-15; derivation
#    ~/ros2_ws/sim_runs/sim_acceptance/03_sea_state/R8_request_for_control.md):
#    per demihull a body box carrying the waterplane (0.917 x 0.122 m, centred
#    0.333 m off the centre plane = the CAD waterplane centroid at the 0.212 m
#    floating draft; matches A_wp 0.224 m², I_T 0.0251 m⁴, I_L 0.0157 m⁴) and a
#    keel fin box under it (1.12 x 0.015 x 0.165 m on the keel line, 0.583 m
#    keel to keel), so displacement, draft and the centre of buoyancy are the
#    CAD's too. The earlier box catamaran (1.2 x 0.15 m, 0.76 m apart, 4.5 cm
#    draft; no source for the 0.76 m) is in sea_states_legacy.yaml, floated
#    by the legacy plant.
hull:
  mass_kg: 16.15                   # 16.01 hull + 2 × 0.07 propellers
  water_density: 1000.0
  gazebo_box: {mass: 16.01, prop_mass: 0.07, x_size: 1.2, y_size: 0.91, z_size: 0.376, offset_z: 0.05}
  catamaran:
    length: 0.917
    demihull_beam: 0.1223
    separation: 0.666
    height: 0.376
    fin: {length: 1.122, width: 0.0152, height: 0.165, separation: 0.583}
  # The boat above the water (sea/wind.py; projected from the full-vessel CAD
  # BR-101447 RevA above the 0.212 m waterline, antenna mast included,
  # 03_sea_state/r8/cad_windage.json): frontal 0.118 m², lateral 0.239 m²,
  # lateral centroid 0.207 m above the water, 1.195 m overall. Coefficients:
  # Fossen 2021 §10.1 symmetric-craft form, experiments c_x 0.50-0.90,
  # c_y 0.70-0.95, c_n 0.05-0.20 (mid values; c_n's sign is not documented for
  # this boat: a bracket, docs/sea_state_model.md §5.10).
  windage: {frontal_area_m2: 0.118, lateral_area_m2: 0.239, length_m: 1.195, centroid_height_m: 0.207,
            cx: 0.7, cy: 0.8, cn: 0.1}
  target_entity: blueboat          # gz model name (canonical link = base_link)
  # Which hydrostatics carry the hull (2026-10-09). `catamaran`: the
  # catamaran replaces the Gazebo box in EVERY run, calm water included, so
  # every scenario floats the same hull and a change of sea never switches
  # the hydrostatics (resolves S11). The box's 2.2 deg under-way trim was a
  # thrust couple on its unphysically soft pitch stiffness; the corpus shows
  # a static 1.2-2.8 deg offset present at rest (load / IMU mounting) and a
  # small dynamic part of inconsistent sign (+0.7..+0.9 deg harbour, -2.5 deg
  # in 1.2 m of water) -- docs/sea_state_model.md §5. `gazebo_box_when_calm`
  # restores the pre-2026-10-09 swap-only-with-waves behaviour.
  hydrostatics: catamaran
  # Hull damping (heave / roll / pitch) as DAMPING RATIOS (2026-11-15, R-8):
  # the sea-state node sizes b = 2ζ√(K (I + A)) on the plant Gazebo
  # integrates (read from /blueboat/robot_description: mass, link inertia,
  # the plugin's added mass) and carries the complement of the plugin's own
  # linear damping -- all of it once Control's vertical damping is 0 (R-8),
  # today's split before. ζ: heave 0.3, roll 0.2 (MSS otter_legacy.m,
  # Fossen & Perez), pitch 0.2 (between otter_legacy's 0.4 and the
  # Capytaine-based otter.m's 0.1); brackets 0.1-0.4, 0.1-0.25, 0.1-0.4.
  # The July corpus's output-only roll damping 0.10-0.25 is report-only
  # (SEEN / HELD-OUT recordings, 2026-11-15). On the identified plant as
  # session 04b applied R-8 (zDotW -14.5, roll / pitch added inertia as rigid
  # inertia, physical CoG +0.1376 m) this gives b = 156 N·s/m, 12.5 and
  # 12.1 N·m·s/rad; natural frequencies 1.35 / 1.18 / 0.74 Hz.
  damping_ratio: {heave: 0.3, roll: 0.2, pitch: 0.2}
  # Soft clip of the catamaran's excess buoyancy, in weights: a C1 tanh
  # knee at knee_g, saturating knee_g + width_g above. Inert for a hull
  # that rides its wave (a +0.1 m crest is 2.2 g); it removes the slam a
  # buried demihull would otherwise publish (5.7 g measured pinned).
  wave_force_clip: {knee_g: 2.5, width_g: 1.0}
  # How the hull feels the waves (2026-11-10, docs/sea_state_model.md §4.2, §5):
  # `hybrid` resolves the wave-SLOPE spectrum up to f_max_hz (the old
  # equal-energy bins lumped the whole short-wave tail into one component and
  # had nothing above ~0.9 Hz at 'smooth'; the real BlueBoat rocks at ~1.1 Hz);
  # 3 Hz = where the 0.15 m demihull beam averages the waves out. `draft_decay`
  # reads the Froude-Krylov pressure at the 4.5 cm draft (cosh(k(h-d))/cosh(kh):
  # 0.83 at 1 Hz, 0.49 at 2 Hz), which the old surface pressure ignored.
  # Without this block the pre-2026-11-10 behaviour holds bit for bit.
  wave_response: {discretisation: hybrid, f_max_hz: 3.0, draft_decay: true}

# How much the current wanders around its configured mean (sea/current.py).
# Fractions are of the MEAN SPEED: sigma_speed = sigma_speed_frac * U,
# eddy RMS = spatial_frac * U. Temporal part: Fossen 2011 §8.3 Gauss-Markov,
# sampled exactly (Gillespie 1996) and joined smoothly, soft-bounded at
# ~2.8 sigma. Spatial part: weak divergence-free eddies, 25-100 m, evolving
# over 5-15 min (Kraichnan 1970 random Fourier modes) -- scale and strength
# are judgement values for a harbour basin (no site measurement exists).
# 'natural' uses the ~10 % turbulence intensity measured in tidal flows
# (Thomson et al. 2012, doi:10.1109/JOE.2012.2191656).
current_variation:
  steady:
    sigma_speed_frac: 0.05
    sigma_dir_deg: 3.0
    tau_speed_s: 60.0
    tau_dir_s: 120.0
    spatial_frac: 0.0
    label: "Steady"
    description: "Almost constant: speed within about ±5 %, direction within a few degrees, the same everywhere. For controlled comparisons."
    reference: "Fossen 2011 §8.3 (Gauss-Markov current)"
  natural:
    sigma_speed_frac: 0.10
    sigma_dir_deg: 10.0
    tau_speed_s: 60.0
    tau_dir_s: 120.0
    spatial_frac: 0.05
    label: "Natural"
    description: "Typical water: speed wanders about ±10 % and direction about ±10° over a minute or two, with weak eddies a few tens of metres across."
    reference: "Fossen 2011 §8.3; Thomson et al. 2012 (turbulence intensity ~10 %); Kraichnan 1970 (eddy field)"
  strong:
    sigma_speed_frac: 0.20
    sigma_dir_deg: 20.0
    tau_speed_s: 60.0
    tau_dir_s: 120.0
    spatial_frac: 0.10
    label: "Gusty / eddying"
    description: "Unsettled flow, as near a basin mouth or a jetty: speed about ±20 %, direction about ±20°, clear eddies. A stress level."
    reference: "Fossen 2011 §8.3; Thomson et al. 2012 (upper end); stress level"

# Wave choices that are not a height (sea/presets.py::apply_wave_options).
wave_options:
  crest:                       # directional spreading cos^2s(Δθ/2)
    short:
      spread_s: 3.0
      label: "Short-crested chop"
      description: "Waves come from a broad spread of directions, as wind chop in a basin does: the boat rolls and pitches at any heading."
      reference: "Longuet-Higgins et al. 1963; presets since 2026-09-05"
    long:
      spread_s: 25.0
      label: "Long-crested swell"
      description: "Long regular crests from one direction, as swell entering through a harbour mouth: mostly pitch when heading into them, mostly roll when side-on."
      reference: "Goda & Suzuki 1975, PARI Tech. Note 230 (s_max 10 wind sea, 75 swell); 25 = the intermediate 'swell, short decay distance' value of secondary sources -- harbour-entrance swell has travelled little; frequency-independent here"
  wakes:                       # scale on the wave level's wake-group rate
    none:
      rate_scale: 0.0
      label: "None"
      description: "No passing boats."
    occasional:
      rate_scale: 1.0
      label: "Occasional"
      description: "A passing wake every several minutes rocks the boat for half a minute."
    frequent:
      rate_scale: 2.5
      label: "Frequent"
      description: "Busy harbour traffic: wake groups every few minutes."

current:
  none:
    speed_mps: 0.0
    sigma_speed_mps: 0.0
    sigma_dir_deg: 0.0
    label: "No current"
    description: "Still water. Strict no-op: nothing is published beyond a zero water velocity."
    reference: "--"
  weak:
    speed_mps: 0.10
    variation: natural
    label: "Weak (0.1 m/s)"
    description: "Residual harbour circulation. Drag ~2.5 N at rest: the controllers barely notice, the track drifts a few metres over a survey line."
    reference: "Fossen 2011 §8.3 (Gauss-Markov current); harbour tidal currents 0.1-0.5 m/s"
  moderate:
    speed_mps: 0.25
    variation: natural
    label: "Moderate (0.25 m/s)"
    description: "Typical tidal flow in a basin mouth. ~8 N of drag; visible cross-track offset and crab angle on lines across the current."
    reference: "Fossen 2011 §8.3"
  strong:
    speed_mps: 0.50
    variation: natural
    label: "Strong (0.5 m/s)"
    description: "Spring-tide / river outflow. ~21 N of drag at rest, a quarter of the modelled thrust: line keeping degrades, turns overshoot down-current."
    reference: "Fossen 2011 §8.3"
  very_strong:
    speed_mps: 0.80
    variation: natural
    label: "Very strong (0.8 m/s) -- stress test"
    description: "Beyond what the harbour produces. ~42 N of drag, over half the modelled thrust: station keeping into the current is marginal and cross-current lines are lost."
    reference: "Fossen 2011 §8.3; stress level, not a field condition"

waves:
  # 2026-09-03 rework (user review: "one wave every second" was too
  # regular and too short): γ 1.5 (a young fetch-limited basin sea is far
  # less peaked than the North-Sea γ 3.3 -- Hasselmann 1973 report 1-7),
  # spreading s 3 (2026-09-05: short-crested harbour chop -- rolls and
  # pitches at every heading; s 6 over six bearings was a two-ray sea),
  # wake groups half as frequent as before and spectrally broad (the
  # user's "too often, too regular"; the boat's own 1.6 Hz ringing was
  # the 20 Hz pose hold, fixed in sea/motion.py, not the sea),
  # Tp = 3.6 √Hs for every level since 2026-11-10 (owner's decision; was 2-4.5 s,
  # "the upper DNV band plus swell/wake influence"): the fetch-limited young-sea
  # relation -- JONSWAP (Hasselmann 1973) and Kahma & Calkoen 1992 give
  # Tp/√Hs = 3.0-4.0 for a harbour (U10 4-10 m/s over 0.3-2 km), the lower DNV
  # bound is 3.6 (on 2026-11-10 it was also chosen because it reproduced the July
  # Shiraishi-jima attitude spectrum, config/corpus_attitude_targets.yaml; since
  # 2026-11-15 that attitude is report-only and judges no level). The site level
  # `harbour_chop` is the exception: its Hs AND Tp come from its own fetch-limited
  # derivation (sea/fetch.py), not from the rule.
  # Long-period energy (wakes, swell trains) lives in the `events:` groups. And an
  # `events:` block: random wave groups -- passing-vessel wakes and swell
  # trains -- as a Poisson process (sea/events.py; Soomere 2007,
  # Appl. Mech. Rev. 60(3), doi:10.1115/1.2730847, for wake groups; the
  # arrival statistics are an assumption, no site measurement exists).
  calm:
    hs_m: 0.0
    tp_s: 0.0
    douglas: 0
    label: "Calm (flat water)"
    description: "Flat water: the boat stays level and the sonar sees no motion at all."
    reference: "WMO No. 306 code table 3700 / Douglas sea scale"
  rippled:
    hs_m: 0.05
    tp_s: 0.80
    gamma: 1.5
    spread_s: 3.0
    douglas: 1
    events: {rate_per_hour: 4.0, hs_m: 0.08, tp_s: 5.0, duration_s: 25.0, from_spread_deg: 60.0}
    label: "Ripples (0.05 m)"
    description: "Light ripples: about half a degree of roll and pitch at ~1.3 Hz, a centimetre of heave; a faint jitter of the seabed line."
    reference: "Hasselmann et al. 1973 (JONSWAP); Kahma & Calkoen 1992 (fetch-limited Tp); DNV-RP-C205 §3.5.10; Soomere 2007 (wakes)"
  harbour_chop:
    # 2026-11-15 (session 03; the owner's ruling on condition D): a PHYSICAL
    # estimate -- the fetch-limited wind sea of the July Shiraishi-jima harbour,
    # Kahma & Calkoen 1992 (stable, eqs 2-3), U10 3.68 m/s from 195 deg (JMA
    # AMeDAS Kasaoka, the survey hours of 2026-07-21/22/23; range 3.3-4.0 m/s)
    # over a 130 m fetch (the harbour world's basin upwind of the surveyed path;
    # 89-165 m). Hs 0.030 m, Tp 0.59 s; wind bracket Hs 0.027-0.034 m, Tp
    # 0.56-0.62 s; the unstable law gives 0.034 m / 0.60 s. Inputs and how they
    # were measured: sea/fetch.py (HARBOUR_CHOP; smoke [10] checks this block
    # equals its output). It REPLACES the inverse estimates fitted to the July
    # attitude (2026-11-10: 0.07 m / 0.95 s; 2026-11-15 re-estimate on the CAD
    # hull: 0.052 m / 0.82 s), which used SEEN / HELD-OUT recordings. No field
    # attitude enters it; that attitude is report-only. A short local chop
    # (wavelength ~0.55 m, under half the hull): it barely rocks the boat; the
    # long-period energy of a harbour (wakes, swell through the entrance) is
    # the `events:` groups' and is not part of this estimate.
    hs_m: 0.030
    tp_s: 0.59
    gamma: 1.5
    spread_s: 3.0
    douglas: 1
    events: {rate_per_hour: 5.0, hs_m: 0.10, tp_s: 5.0, duration_s: 25.0, from_spread_deg: 60.0}
    label: "Harbour chop (site, 0.03 m)"
    description: "The local wind chop of the July Shiraishi-jima harbour: a 3.7 m/s south-south-west wind over the ~130 m basin raises 3 cm waves at about 1.7 Hz -- shorter than the boat, which mostly rides over them. Occasional longer wave groups (wakes) rock it."
    reference: "Fetch-limited wind sea, Kahma & Calkoen 1992 (J. Phys. Oceanogr. 22:1389) eqs 2-3; wind JMA AMeDAS Kasaoka (July 2026 survey hours); fetch from the harbour world; Soomere 2007 (wakes)"
  smooth:
    hs_m: 0.15
    tp_s: 1.39
    gamma: 1.5
    spread_s: 3.0
    douglas: 2
    events: {rate_per_hour: 6.0, hs_m: 0.12, tp_s: 5.5, duration_s: 25.0, from_spread_deg: 60.0}
    label: "Light chop (0.15 m)"
    description: "A stronger harbour chop: the boat rolls and pitches about two degrees at ~0.9 Hz and bobs three centimetres. Clear port/starboard banding, a wavy seabed line, targets stretched or repeated along track."
    reference: "WMO 3700 code 2; Hasselmann et al. 1973; Kahma & Calkoen 1992; DNV-RP-C205 §3.5.10; Soomere 2007"
  slight:
    hs_m: 0.35
    tp_s: 2.13
    gamma: 1.5
    spread_s: 3.0
    douglas: 2
    events: {rate_per_hour: 8.0, hs_m: 0.25, tp_s: 6.0, duration_s: 25.0, from_spread_deg: 45.0}
    label: "Choppy (0.35 m)"
    description: "A fresh breeze across the basin: three to five degrees of roll and pitch, heave of about eight centimetres. Strong banding, the seabed line wobbles, features shift and repeat along the track."
    reference: "Hasselmann et al. 1973; Kahma & Calkoen 1992; DNV-RP-C205 §3.5.10; Soomere 2007"
  rough:
    hs_m: 0.60
    tp_s: 2.79
    gamma: 1.5
    spread_s: 3.0
    douglas: 3
    events: {rate_per_hour: 15.0, hs_m: 0.35, tp_s: 7.0, duration_s: 30.0, from_spread_deg: 45.0}
    label: "Rough (0.6 m) -- stress test"
    description: "The most an enclosed basin raises and more than a 1.2 m boat should survey in: about four degrees of roll and pitch, twelve centimetres of heave; the sonar geometry breaks down at times."
    reference: "Hasselmann et al. 1973; Kahma & Calkoen 1992; DNV-RP-C205 §3.5.10; Soomere 2007; stress level"
